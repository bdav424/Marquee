# MPA rating reasons, by title.
#
# Why this is a hand-kept file and not a fetch: every automatic source is
# closed. Alamo publishes the certification and no reason text. TMDB does not
# model reasons at all. IMDb carries the field only in its paid bulk feed,
# licensed per use case. filmratings.com — the MPA's own CARA database and the
# origin of every one of these sentences — sits behind Imperva bot protection:
# no query parameter is honoured, a POST returns the unfiltered page
# byte-for-byte, and its JavaScript exposes no search endpoint. Getting past
# that would mean defeating an access control, and this project will not.
#
# refresh.py writes logs/needs-reason.txt each cycle with a ready-to-paste
# stub for anything still missing, so this file is filled in a line at a time
# as new films arrive. A reason never changes once CARA assigns it.
#
# Copy the sentence VERBATIM from filmratings.com. The parser reads the actual
# wording — "strong bloody violence" scores differently from "some violence" —
# so paraphrasing changes the verdict.
#
# Titles match loosely: case, punctuation, leading articles, parentheticals,
# a trailing year, Alamo's programming strands and "Nth Anniversary" suffixes
# are all ignored. "Psycho Cinema Presents: Mystery Meat" finds an entry filed
# under "Mystery Meat".

# --- Films with no descriptor in existence -----------------------------------
# MUST stay above [reasons]: once a table header is open, every key below it
# belongs to that table, and this one would quietly become reasons.no_descriptor.
#
# Rating descriptors only began in 1990, so anything rated before then carries
# a certification and nothing else — there is no sentence to find. Listing a
# title here keeps it `unknown`, which is honest since we genuinely do not know
# what is in it, but stops it appearing in needs-reason.txt as work that can
# never be done. Also use it for festivals, live broadcasts and anything never
# submitted for a rating.

no_descriptor = [
  # Seen on the live Winchester schedule: pre-1990, or never rated.
  "Taxi Driver",
  "Phantom of the Paradise",
  "Mothra vs. Godzilla",
  "Where is the Friend's House?",
  "GenreBlast Film Festival",
  "Six: The Musical Live!",
]


# --- The reasons themselves ---------------------------------------------------

[reasons]

# Empty until real sentences are pasted in. It used to carry two examples of
# the shape — "The Long Dark" and "Ironwood", both invented for
# scripts/build_sample.py — and that was a hazard, not a convenience: if a
# real film ever booked under either name it would have been dimmed or cleared
# on a reason CARA never wrote. A verdict from a made-up sentence is worse
# than a question mark, so the file ships empty.
#
# The shape, for reference, is one line per title:
#
#   "Title As Billed" = "Rated R for strong bloody violence, and language."
