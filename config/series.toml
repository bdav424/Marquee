# Series / event tag treatments.
#
# One-night programming is half the reason this display exists, so a series
# tag gets its own strong visual treatment — per-series colour, distinct from
# the rating chip in both shape and weight.
#
# SEED DATA. These are Alamo's well-known recurring strands, seeded from the
# brief plus public programming names. They have NOT been reconciled against
# the real Winchester feed, because endpoint discovery is still blocked. Once
# the feed is live, run the unmatched-series report and fix these up.
#
# Matching is substring-based against a normalised form of whatever string the
# feed carries, so this survives not knowing the feed's exact field shape.

[defaults]
# Any series tag the feed carries that matches nothing below still gets a
# badge — an unrecognised strand is not the same as no strand, and silently
# dropping it would hide exactly the programming this display exists to show.
background = "#4A4A52"
foreground = "#F5F5F0"
label = "SERIES"
one_night = false
priority = 0


# --- Recurring strands ------------------------------------------------------
# priority breaks ties when a showing carries more than one tag; highest wins
# for the primary badge, the rest render as secondary pips.

[[series]]
key = "terror_tuesday"
match = ["terror tuesday"]
label = "TERROR TUESDAY"
background = "#8B0000"
foreground = "#FFF0F0"
one_night = true
priority = 90

